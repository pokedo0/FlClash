name: build

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      - name: Resolve the version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-.*)?$ ]]; then
            echo "::error::$TAG does not start with vX.Y.Z"
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          committed="$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)"
          build="$(date -u +%Y%m%d%H)"
          if ((build <= ${committed:-0})); then
            build=$((committed + 1))
          fi
          echo "version=$name+$build" >> "$GITHUB_OUTPUT"
          echo "$TAG builds $name+$build (pubspec committed build: ${committed:-0})"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply the tag's version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed "s/^version: .*/version: $VERSION/" pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Setup Android Signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for var in KEYSTORE KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing required Android signing secret: $var"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE" | tr -d '\r\n' | base64 --decode > android/app/keystore.jks
          if [[ ! -s android/app/keystore.jks ]]; then
            echo "::error::Decoded android/app/keystore.jks is empty"
            exit 1
          fi
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties
          echo "Android release signing configured (keystore size: $(wc -c < android/app/keystore.jks) bytes)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart tool/package.dart android ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Verify Android APK package name and signing
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools="$(ls -d "$sdk_root"/build-tools/* | sort -V | tail -n 1)"
          shopt -s nullglob
          apks=(./dist/*.apk)
          if ((${#apks[@]} == 0)); then
            echo "::error::No APK files found in ./dist"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            badging="$("$build_tools/aapt2" dump badging "$apk")"
            pkg="$(printf '%s\n' "$badging" | sed -nE "s/^package: name='([^']+)'.*/\1/p" | head -n 1)"
            vcode="$(printf '%s\n' "$badging" | sed -nE "s/^package: .*versionCode='([^']+)'.*/\1/p" | head -n 1)"
            certs="$("$build_tools/apksigner" verify --print-certs "$apk")"
            echo "Verified $apk -> package=$pkg versionCode=$vcode"
            printf '%s\n' "$certs" | grep -E 'Signer #1 certificate (DN|SHA-256 digest):'
            if [[ "$pkg" != "com.news.toutiao" ]]; then
              echo "::error::Expected package com.news.toutiao, got $pkg in $apk"
              exit 1
            fi
            if printf '%s\n' "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the debug keystore"
              exit 1
            fi
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: ./dist
          overwrite: true

  upload:
    permissions:
      contents: write
    needs: [ version, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Apply the tag's version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/
          pattern: artifact-*

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Merge the build manifests
        run: dart run tool/package.dart merge artifacts/* --out dist

      - name: Generate release notes
        shell: bash
        env:
          IS_STABLE: ${{ env.IS_STABLE }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$IS_STABLE" == 'true' ]]; then
            dart run tool/changelog.dart render release --tag "$TAG" --out release.md || \
              dart run tool/changelog.dart render release --out release.md
          else
            dart run tool/changelog.dart build --unreleased || true
            dart run tool/changelog.dart render release --out release.md
          fi

      - name: Patch release.md
        run: |
          line=$(jq -r '.artifacts[0].line' dist/manifest.json)
          version=$(jq -r '.artifacts[0].version' dist/manifest.json)
          sed \
            -e "s|chen08209/FlClash|${{ github.repository }}|g" \
            -e "s|TAG|${{ github.ref_name }}|g" \
            -e "s|LINE|$line|g" \
            -e "s|VERSION|$version|g" \
            ./.github/release_template.md >> release.md

      - name: Copy APKs under their legacy names
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          cd ./dist
          jq -r '.artifacts[]
            | select(.line == "dev")
            | select(.os == "android")
            | [.name, "FlClash-\(.version)-android-" + {arm64: "arm64-v8a", armv7: "armeabi-v7a", amd64: "x86_64"}[.arch] + ".apk"]
            | @tsv' manifest.json |
            while IFS=$'\t' read -r name legacy; do
              cp "$name" "$legacy"
              sha256sum "./$legacy" >> SHA256SUMS
            done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_STABLE != 'true' }}
