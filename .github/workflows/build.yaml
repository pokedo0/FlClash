name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.8.95 or v0.8.95)'
        required: true
        default: '0.8.95'
      target_platform:
        description: 'Target platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - 'android'
          - 'all'

env:
  IS_STABLE: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.44.4'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test release notes generation
        shell: bash
        run: bash .github/scripts/generate_release_notes_test.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Validate local Flutter packages
        shell: bash
        run: |
          for package in plugins/proxy plugins/wifi_ssid plugins/window_ext plugins/setup; do
            (
              cd "$package"
              flutter pub get
              flutter analyze --no-fatal-infos
            )
          done

      - name: Run local plugin tests
        shell: bash
        run: |
          (
            cd plugins/proxy
            flutter test --reporter expanded
          )
          (
            cd plugins/wifi_ssid
            flutter test --reporter expanded
          )

      - name: Validate setup build tool
        working-directory: plugins/setup/buildkit/build_tool
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go test .
          go vet .

      - name: Validate Rust components
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo test --manifest-path services/helper/Cargo.toml
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target_platform == 'all')
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  build:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs: [ test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target_platform }}" = "android" ] && [ "${{ matrix.platform }}" != "android" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup rust
        if: steps.filter.outputs.skip != 'true' && startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update version in pubspec.yaml
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw_ver="${{ inputs.version }}"
            clean_ver="${raw_ver#v}"
            today="$(date +%Y%m%d)"
            build_num="${today}${{ github.run_number }}"
            full_ver="${clean_ver}+${build_num}"
            echo "Setting version to $full_ver in pubspec.yaml"
            sed -i.bak -E "s/^version: .*/version: $full_ver/" pubspec.yaml
            grep "^version:" pubspec.yaml
          fi

      - name: Setup Android Signing
        if: steps.filter.outputs.skip != 'true' && startsWith(matrix.platform,'android')
        run: |
          keystore_b64="${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE }}"
          service_json_b64="${{ secrets.SERVICE_JSON }}"
          if [ -n "$keystore_b64" ]; then
            printf '%s' "$keystore_b64" | base64 --decode > android/app/keystore.jks
          fi
          if [ -n "$service_json_b64" ]; then
            printf '%s' "$service_json_b64" | base64 --decode > android/app/google-services.json
          fi
          {
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        if: steps.filter.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Enable git long paths (Windows)
        if: steps.filter.outputs.skip != 'true' && startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Flutter
        if: steps.filter.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: steps.filter.outputs.skip != 'true' && startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup NDK
        if: steps.filter.outputs.skip != 'true' && startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        if: steps.filter.outputs.skip != 'true'
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        if: steps.filter.outputs.skip != 'true'
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Upload
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  changelog:
    if: github.event_name == 'push' && !contains(github.ref, '-')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Generate
        run: |
          last_ver=$(grep -m1 '^## ' CHANGELOG.md 2>/dev/null | sed 's/^## //')

          mapfile -t tags < <(git tag --merged HEAD --sort=-creatordate)

          temp="NEW_CHANGELOG.md"
          : > "$temp"

          for i in "${!tags[@]}"; do
              curr="${tags[i]}"
              [[ "$curr" == "$last_ver" ]] && break

              prev="${tags[i+1]}"
              range="${prev:+$prev..}$curr"

              echo -e "## $curr\n" >> "$temp"
              git log --no-merges --pretty=format:"%B" "$range" | \
              awk '!/Update changelog/ && NF {print "- " $0 "\n"}' >> "$temp"
          done
          [ -f CHANGELOG.md ] && cat CHANGELOG.md >> "$temp"
          
          mv "$temp" CHANGELOG.md

      - name: Commit
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            echo "Commit pushing"
            git config --local user.email "chen08209@gmail.com"
            git config --local user.name "chen08209"
            git commit -m "Update changelog"
            if git push; then
              echo "Push succeeded"
            else
              echo "Push failed"
              exit 1
            fi
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    permissions:
      contents: write
    needs: [ build ]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        ports:
          - 8081:8081
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Determine Release Tag & Version
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw_ver="${{ inputs.version }}"
            clean_ver="${raw_ver#v}"
            echo "release_tag=v${clean_ver}" >> "$GITHUB_OUTPUT"
            echo "version=${clean_ver}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "version=$(echo "${{ github.ref_name }}" | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release.md
        shell: bash
        run: |
          pre_tag=$(
            curl --silent "https://api.github.com/repos/chen08209/FlClash/releases/latest" |
              sed -nE 's/.*"tag_name": "([^"]+)".*/\1/p'
          )
          bash .github/scripts/generate_release_notes.sh "$pre_tag" release.md || echo "Release notes generated" > release.md

      - name: Push to telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.release_tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python release_telegram.py

      - name: Patch release.md
        run: |
          version="${{ steps.release_meta.outputs.version }}"
          if [ -f ./.github/release_template.md ]; then
            sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md
            sed -i "s|chen08209/FlClash|${{ github.repository }}|g" release.md
          fi

      - name: Generate sha256
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        if: ${{ env.IS_STABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.release_meta.outputs.release_tag }}
          files: ./dist/*
          body_path: './release.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Homebrew Cask Source Dir
        if: ${{ env.IS_STABLE == 'true' && github.repository == 'chen08209/FlClash' }}
        run: |
          version="${{ steps.release_meta.outputs.version }}"
          arm_sha=$(sha256sum "./dist/FlClash-${version}-macos-arm64.dmg" | awk '{print $1}')
          amd_sha=$(sha256sum "./dist/FlClash-${version}-macos-amd64.dmg" | awk '{print $1}')

          mkdir -p ./brew/Casks
          sed \
            -e "s|VERSION|$version|g" \
            -e "s|ARM_SHA256|$arm_sha|g" \
            -e "s|AMD_SHA256|$amd_sha|g" \
            ./.github/homebrew_cask_template.rb > ./brew/Casks/flclash.rb

      - name: Push to Homebrew tap
        if: ${{ env.IS_STABLE == 'true' && github.repository == 'chen08209/FlClash' }}
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.HOMEBREW_SSH_DEPLOY_KEY }}
        with:
          source-directory: ./brew/
          destination-github-username: chen08209
          destination-repository-name: homebrew-tap
          user-name: 'chen08029'
          user-email: 'chen08209@gmail.com'
          target-branch: main
          commit-message: Update Homebrew cask from ${{ steps.release_meta.outputs.release_tag }}
          target-directory: /

      - name: Create Fdroid Source Dir
        if: ${{ env.IS_STABLE == 'true' && github.repository == 'chen08209/FlClash' }}
        run: |
          mkdir -p ./tmp
          cp ./dist/*android-arm64-v8a* ./tmp/ || true
          echo "Files copied successfully"

      - name: Push to fdroid repo
        if: ${{ env.IS_STABLE == 'true' && github.repository == 'chen08209/FlClash' }}
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: ./tmp/
          destination-github-username: chen08209
          destination-repository-name: FlClash-fdroid-repo
          user-name: 'chen08029'
          user-email: 'chen08209@gmail.com'
          target-branch: main
          commit-message: Update from ${{ steps.release_meta.outputs.release_tag }}
          target-directory: /tmp/
